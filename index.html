<header class="no-print app-header"><div class="header-hero"><div class="brand-block"><img class="brand-logo" src="https://static.wixstatic.com/media/e1fca1_f5f2e6c6e0444a0290dcc88b757a8ce5~mv2.png" alt="PreparaEdu"><div><p class="eyebrow">Painel analítico</p><h1>ENAMED Medicina 2025</h1><p class="subtitle">Desempenho, proficiência e comparativos para apoiar decisões acadêmicas.</p></div></div><div class="header-badges"><span class="source-chip">Fonte: Microdados ENAMED 2025 (INEP)</span><div class="meta" id="meta"></div></div></div><div class="filters"><input id="search" placeholder="Buscar curso, IES, município ou código"><select id="sigla"></select><select id="ies"></select><select id="uf"></select><select id="categoria"></select></div><div class="buttons"><span id="count" style="align-self:center;color:#d9e8ff;font-size:13px"></span></div></header>

<script>
const ITEM_ANALYSIS_FILES=["item-analysis-courses-1.json","item-analysis-courses-2.json","item-analysis-courses-3.json","item-analysis-courses-4.json"];let ITEM_ANALYSIS=null;async function loadItemAnalysis(){const [meta,...chunks]=await Promise.all([fetch('item-analysis-meta.json').then(r=>r.json()),...ITEM_ANALYSIS_FILES.map(f=>fetch(f).then(r=>r.json()))]);ITEM_ANALYSIS={...meta,courses:Object.assign({},...chunks)};}
const PREPARAEDU_LOGO='https://static.wixstatic.com/media/e1fca1_f5f2e6c6e0444a0290dcc88b757a8ce5~mv2.png';const DATA_FILES=["courses-1.json"];let DATA=null;let state={rows:[],selected:null};async function loadData(){const [meta,...chunks]=await Promise.all([fetch('app-meta.json').then(r=>r.json()),...DATA_FILES.map(f=>fetch(f).then(r=>r.json()))]);DATA={...meta,courses:chunks.flat()};DATA.logo=DATA.logo||PREPARAEDU_LOGO;state.rows=DATA.courses;state.selected=state.rows[0]||null;}async function boot(){try{await Promise.all([loadData(),loadItemAnalysis()]);init()}catch(err){console.error(err);document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px;font-family:Arial">Falha ao carregar os dados do relatório. Verifique se os arquivos JSON foram enviados junto com index.html.</pre>';}}const nf=new Intl.NumberFormat('pt-BR');const pf=new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});function one(id){return document.getElementById(id)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(v,d=2){return v==null||Number.isNaN(v)?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}function pct(v){return v==null?'-':pf.format(v)}function pctClean(v){if(v==null||Number.isNaN(Number(v)))return'-';return Math.abs(Number(v)-1)<1e-9?'100%':pf.format(v)}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function fill(id,label,vals,current){const el=one(id);const keep=current&&vals.includes(current);el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');el.value=keep?current:''}

function render(){renderKpis();renderRows();renderDetail()}function renderKpis(){const rows=state.rows,total=rows.reduce((s,c)=>s+(c.inscritos||0),0),part=rows.reduce((s,c)=>s+(c.participantes||0),0);let sum=0,ct=0;rows.forEach(c=>{if(c.medias.NT_GER!=null){sum+=c.medias.NT_GER*(c.participantes||1);ct+=(c.participantes||1)}});one('kCursos').textContent=nf.format(rows.length);one('kInscritos').textContent=nf.format(total);one('kPart').textContent=nf.format(part);one('kPres').textContent=total?pctClean(part/total):'-';one('kNota').textContent=ct?fmt(sum/ct,2):'-';one('count').textContent=rows.length+' curso'+(rows.length!==1?'s':'')}function renderRows(){one('rows').innerHTML=state.rows.map(c=>`<tr class="course-row ${state.selected===c?'active':''}" data-code="${esc(c.coCurso)}"><td><div class="course-name">MEDICINA <span class="badge">ENAMED ${esc(c.conceito)}</span></div><div class="course-sub">${esc(c.ies)}${c.sigla?' ('+esc(c.sigla)+')':''} · ${esc(c.municipio)}/${esc(c.uf)} · Cód. ${esc(c.coCurso)}</div><div class="course-mini">Nota ${fmt(c.medias.NT_GER,2)} · ${nf.format(c.participantes||0)} participante(s) · ${esc(c.modalidade)}</div></td><td class="course-action"><button class="print-small" title="Imprimir PDF" onclick="event.stopPropagation();printCourse('${esc(c.coCurso)}')">PDF</button></td></tr>`).join('')||'<tr><td colspan="2">Nenhum curso encontrado.</td></tr>';document.querySelectorAll('.course-row').forEach(tr=>tr.onclick=()=>{state.selected=DATA.courses.find(c=>c.coCurso===tr.dataset.code);render()})}function metric(label,val){return `<div class="metric"><b>${label}</b><span>${val}</span></div>`}function areaItensValidos(area){const n=(area||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(n.includes('cirurgia'))return 17;if(n.includes('familia')||n.includes('saude coletiva'))return 19;if(n.includes('ginecologia')||n.includes('obstetricia'))return 17;if(n.includes('clinica'))return 19;if(n.includes('pediatria'))return 18;return 20}function areaTaxa(a){const denom=areaItensValidos(a.area),media=Number(String(a.media??0).replace(',','.'));return denom&&!Number.isNaN(media)?(media/denom*100):0}function areaKey(area){return norm(area).replace(/[^a-z0-9]+/g,' ').trim()}const AREA_NACIONAL_FIXA={'clinica medica':58.4,'pediatria':54.2,'cirurgia geral':67.1,'ginecologia e obstetricia':66.1,'medicina da familia e comunidade saude coletiva':64.3};function areaNacionalTaxa(area){const key=areaKey(area);return AREA_NACIONAL_FIXA[key]??null}function conceitoReferencia(c){const n=Number(c?.conceito);if(!Number.isFinite(n))return null;return n<3?3:n}function areaConceitoTaxa(area,conceitoRef){if(!conceitoRef)return null;const key=areaKey(area);let soma=0,peso=0;for(const curso of DATA.courses||[]){if(Number(curso.conceito)!==Number(conceitoRef))continue;const stat=(curso.areaStats||[]).find(a=>areaKey(a.area)===key);if(!stat)continue;const media=Number(String(stat.media??0).replace(',','.'));const w=Number(curso.participantes||0)||1;if(Number.isNaN(media))continue;soma+=media*w;peso+=w}if(!peso)return null;const denom=areaItensValidos(area);return denom?(soma/peso)/denom*100:null}function areaAnalysis(c){const iconFor=a=>{const n=(a||'').toLowerCase();if(n.includes('clínica')||n.includes('clinica'))return '▥';if(n.includes('pediatria'))return '⌁';if(n.includes('cirurgia'))return '∕';if(n.includes('ginecologia'))return '♀';return '●'};const conceitoRef=conceitoReferencia(c);const conceitoLabel=conceitoRef?`ENAMED ${conceitoRef}`:'ENAMED';const rows=[...c.areaStats].sort((a,b)=>areaTaxa(b)-areaTaxa(a)).map(a=>{const denom=areaItensValidos(a.area),taxa=areaTaxa(a),nat=areaNacionalTaxa(a.area),conc=areaConceitoTaxa(a.area,conceitoRef);return `<div class="med-area-row"><div class="med-area-icon">${iconFor(a.area)}</div><div class="med-area-name">${esc(a.area)}</div><div><span class="med-area-score-pill">${fmt(a.media,1)} <small>/ ${denom}</small></span></div><div class="med-area-bars"><div class="med-area-mini-row"><span>Curso</span><div class="track"><div class="bar" style="width:${Math.max(0,Math.min(100,taxa))}%"></div></div></div><div class="med-area-mini-row national"><span>Nacional</span><div class="track"><div class="bar national-bar" style="width:${Math.max(0,Math.min(100,nat??0))}%"></div></div></div><div class="med-area-mini-row concept"><span>${conceitoLabel}</span><div class="track"><div class="bar concept-bar" style="width:${Math.max(0,Math.min(100,conc??0))}%"></div></div></div></div><div class="med-area-pct"><b>${fmt(taxa,1)}%</b><small>${nat==null?'-':fmt(nat,1)+'%'}</small><small class="concept-ref">${conc==null?'-':fmt(conc,1)+'%'}</small></div></div>`}).join('');return `<div class="card med-area-card"><div class="med-area-title"><div class="med-area-title-icon">▥</div><div><h3>Análise por Área Médica</h3><p>Comparativo entre o desempenho do curso, a média nacional e a média de referência por conceito ENAMED. Para cursos ENAMED 1 ou 2, a referência exibida é ENAMED 3 como meta.</p></div></div><div class="med-area-table"><div class="med-area-header"><div></div><div>Área Médica</div><div>Média do curso</div><div>Curso x Referências</div><div>Percentual</div></div>${rows}</div></div>`}function areaVerticalChart(c){const sorted=[...c.areaStats].sort((a,b)=>areaTaxa(b)-areaTaxa(a)),max=Math.max(...sorted.map(a=>areaTaxa(a)),1),colors=['#16a34a','#3b82f6','#ff981f','#8b5cf6','#06b6d4'];return `<div class="card area-vertical-card"><h3>Comparativo por Área Médica</h3><p class="area-vnote">Taxa média de acerto dos estudantes presentes em cada área avaliada, calculada pelos itens válidos e ordenada da maior para a menor.</p><div class="area-vertical-chart">${sorted.map((a,i)=>{const taxa=areaTaxa(a);return `<div class="area-vbar-wrap"><span class="area-vvalue">${fmt(taxa,1)}%</span><div class="area-vbar" style="--area-color:${colors[i%colors.length]};height:${Math.max(5,taxa/max*150)}px"></div><div class="area-vlabel">${esc(a.area)}</div></div>`}).join('')}</div></div>`}function padraoCard(c){const pctA=c.acimaPadraoPct??0,q=c.acimaPadraoQtd??0,total=c.participantes||0,abaixo=Math.max(0,total-q),pctNao=total?abaixo/total:0,grad=`conic-gradient(var(--green) 0 ${(pctA*100).toFixed(2)}%, var(--yellow) ${(pctA*100).toFixed(2)}% 100%)`;return `<div class="card donut-card padrao-card"><div><h3>Concluintes Proficientes / Proficientes</h3><p class="padrao-sub">Distribuição oficial do curso conforme planilha de conceito.</p><div class="padrao-legend-item"><span class="padrao-legend-dot" style="background:var(--green)"></span><div><span class="padrao-legend-title">Proficientes</span><span class="padrao-legend-value">${nf.format(q)} estudante(s) · ${pct(pctA)}</span></div></div><div class="padrao-legend-item"><span class="padrao-legend-dot" style="background:var(--yellow)"></span><div><span class="padrao-legend-title">Não proficientes</span><span class="padrao-legend-value">${nf.format(abaixo)} estudante(s) · ${pct(pctNao)}</span></div></div></div><div class="donut" style="background:${grad}"><div><strong>${nf.format(total)}</strong><span>partic.</span></div></div></div>`}function triChart(c){const vals=c.alunos.map(a=>a.prof).filter(v=>v!=null),bins=[['< -1,0',v=>v<-1,'#ef4444'],['-1,0 a -0,5',v=>v>=-1&&v<-.5,'#f87171'],['-0,5 a 0',v=>v>=-.5&&v<0,'#f59e0b'],['0 a 0,5',v=>v>=0&&v<.5,'#f59e0b'],['0,5 a 1,0',v=>v>=.5&&v<=1,'#10b981'],['> 1,0',v=>v>1,'#059669']];if(!vals.length)return'';const counts=bins.map(b=>vals.filter(b[1]).length),max=Math.max(...counts,1),total=vals.length,below=counts[0]+counts[1]+counts[2],mid=counts[2]+counts[3],above=counts[3]+counts[4]+counts[5];const pctN=n=>total?fmt(n/total*100,1):'0,0';const summary=(cls,ico,title,n)=>'<div class="tri-summary-card '+cls+'"><div class="ico">'+ico+'</div><div><b>'+title+'</b><strong>'+nf.format(n)+' aluno(s)</strong><span>'+pctN(n)+'%</span></div></div>';return `<div class="card"><h3>Distribuição da Proficiência TRI (theta)<span class="tri-total-pill">${nf.format(total)} estudante(s)</span></h3><p style="color:var(--muted)">Organização visual dos estudantes presentes por faixas de proficiência técnica.</p><div class="tri-bars"><div class="tri-yaxis"><span>${nf.format(max)}</span><span>${nf.format(Math.round(max*.75))}</span><span>${nf.format(Math.round(max*.5))}</span><span>${nf.format(Math.round(max*.25))}</span><span>0</span></div>${bins.map((b,i)=>`<div class="tri-bin">${i===3?'<span class="tri-zero"><em>Ponto central</em></span>':''}<strong style="color:${b[2]}">${counts[i]}</strong><div class="tri-bar" style="height:${Math.max(4,counts[i]/max*118)}px;background:${b[2]}"></div><span class="tri-label">${b[0]}</span></div>`).join('')}</div><div class="tri-summary">${summary('low','↓','Abaixo de 0',below)}${summary('mid','=','Entre -0,5 e 0,5',mid)}${summary('high','↑','Acima de 0',above)}</div><p class="note"><b>Leitura pedagógica:</b> A proficiência TRI, representada pelo valor de theta, é uma medida técnica usada pelo INEP para estimar o desempenho do estudante na prova objetiva. No ENAMED, o valor de theta é disponibilizado em escala técnica com mínimo -9,999 e máximo 9,999. No gráfico, o zero indica o ponto central da escala: valores negativos ficam abaixo desse ponto de referência e valores positivos ficam acima, permitindo visualizar a concentração da turma em níveis mais baixos, intermediários ou mais altos de proficiência.</p></div>`}function notaGeralChart(c){

function nationalPositionChart(c){
  const rows=DATA.courses.map(x=>({nota:Number(x.medias&&x.medias.NT_GER),sigla:x.sigla||'',ies:x.ies||''})).filter(x=>Number.isFinite(x.nota));
  const course=Number(c.medias&&c.medias.NT_GER);
  if(!rows.length||!Number.isFinite(course))return '';
  const values=rows.map(x=>x.nota).sort((a,b)=>a-b);
  const n=values.length;
  const mean=values.reduce((a,b)=>a+b,0)/n;
  const variance=values.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n;
  const sd=Math.sqrt(variance)||1;
  const min=values[0], max=values[values.length-1];
  const positiveValues=values.filter(v=>v>0);
  const minDisplay=positiveValues.length?positiveValues[0]:min;
  const start=Math.max(0,Math.floor((min-2)/5)*5);
  const stop=Math.min(100,Math.ceil((max+2)/5)*5);
  const span=Math.max(5,stop-start);
  const bins=[];
  for(let a=start;a<stop;a+=5)bins.push({from:a,to:a+5,label:`${a}-${a+5}`,count:0});
  values.forEach(v=>{let b=bins.find((b,i)=>v>=b.from&&(v<b.to||(i===bins.length-1&&v<=b.to)));if(b)b.count++;});
  const maxPct=Math.max(...bins.map(b=>b.count/n*100),1);
  const W=720,H=286,L=58,R=26,T=30,B=62,plotW=W-L-R,plotH=H-T-B;
  const x=v=>L+((Math.max(start,Math.min(stop,v))-start)/span)*plotW;
  const y=p=>T+plotH-(p/maxPct)*plotH;
  const bw=Math.max(14,(plotW/bins.length)*.72);
  const bars=bins.map(b=>{const bp=b.count/n*100;const h=Math.max(2,T+plotH-y(bp));const bx=x((b.from+b.to)/2)-bw/2;return `<rect x="${bx.toFixed(1)}" y="${(T+plotH-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="#aebbd0" opacity=".82"/><text x="${(bx+bw/2).toFixed(1)}" y="${(T+plotH+22).toFixed(1)}" text-anchor="middle" class="np-axis-label">${b.label}</text>`}).join('');
  const grid=[0,.25,.5,.75,1].map(t=>{const yy=T+plotH-(t*plotH);const val=maxPct*t;return `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" class="np-grid"/><text x="${L-10}" y="${(yy+4).toFixed(1)}" text-anchor="end" class="np-y-label">${fmt(val,0)}</text>`}).join('');
  const peak=1/(sd*Math.sqrt(2*Math.PI));
  const curve=[];
  for(let i=0;i<=140;i++){const v=start+span*i/140;const density=(1/(sd*Math.sqrt(2*Math.PI)))*Math.exp(-.5*Math.pow((v-mean)/sd,2));const pctVal=(density/peak)*maxPct*.92;curve.push(`${x(v).toFixed(1)},${y(pctVal).toFixed(1)}`);}
  const courseX=x(course), meanX=x(mean);
  const courseLabel=esc((c.sigla||c.ies||'Seu curso').split(' - ')[0]);
  const closeLabels=Math.abs(courseX-meanX)<86;
  const clampLabel=v=>Math.min(W-R-14,Math.max(L+14,v));
  const courseTextX=closeLabels?clampLabel(courseX+(courseX<=meanX?-10:10)):clampLabel(courseX);
  const meanTextX=closeLabels?clampLabel(meanX+(courseX<=meanX?10:-10)):clampLabel(meanX);
  const courseAnchor=closeLabels?(courseX<=meanX?'end':'start'):'middle';
  const meanAnchor=closeLabels?(courseX<=meanX?'start':'end'):'middle';
  const courseLabelY=closeLabels?T-22:T-18;
  const meanLabelY=closeLabels?T-2:T-9;
  return `<div class="card national-position-card"><h3>Posição Nacional - Proficiência</h3><p class="national-position-sub">Distribuição das notas médias dos cursos participantes, com destaque para o curso selecionado.</p><div class="national-chart-box"><svg class="national-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuição nacional das notas médias"><g>${grid}</g><line x1="${L}" y1="${T+plotH}" x2="${W-R}" y2="${T+plotH}" class="np-axis"/>${bars}<polyline points="${curve.join(' ')}" class="np-curve"/><line x1="${meanX.toFixed(1)}" y1="${T}" x2="${meanX.toFixed(1)}" y2="${T+plotH}" class="np-mean-line"/><text x="${meanTextX.toFixed(1)}" y="${meanLabelY}" text-anchor="${meanAnchor}" class="np-mean-label">Média ${fmt(mean,1)}</text><line x1="${courseX.toFixed(1)}" y1="${T-4}" x2="${courseX.toFixed(1)}" y2="${T+plotH}" class="np-course-line"/><text x="${courseTextX.toFixed(1)}" y="${courseLabelY}" text-anchor="${courseAnchor}" class="np-course-label"><tspan x="${courseTextX.toFixed(1)}">${courseLabel}</tspan><tspan x="${courseTextX.toFixed(1)}" dy="13" class="np-course-value">Média curso ${fmt(course,1)}</tspan></text><text x="${L}" y="${H-12}" class="np-x-title">Nota Média do Curso</text><text x="16" y="${T+plotH/2}" transform="rotate(-90 16 ${T+plotH/2})" text-anchor="middle" class="np-y-title">% Cursos</text></svg><div class="national-legend"><span><i class="dist"></i>Distribuição</span><span><i class="curve"></i>Curva normal</span><span><i class="course"></i>Seu curso</span><span><i class="mean"></i>Média nacional</span></div><p class="national-summary">${nf.format(n)} cursos · Média: ${fmt(mean,1)} · Desvio: ${fmt(sd,1)} · Menor: ${fmt(minDisplay,1)} · Maior: ${fmt(max,1)}</p></div></div>`;
}

I49']}];const keyAxis={};axisDefs.forEach(a=>a.keys.forEach(k=>keyAxis[k]=a));function validEntriesFrom(dist){return Object.entries(dist||{}).filter(([v])=>['1','2','3','4','5','6'].includes(v))}function meanFromEntries(valid){const total=valid.reduce((s,[,n])=>s+n,0);if(!total)return null;return{valid,total,media:valid.reduce((s,[v,n])=>s+Number(v)*n,0)/total}}function validEntries(k){return validEntriesFrom(c.qe[k]||{})}function statsFor(k){return meanFromEntries(validEntries(k))}function nationalStatsFor(k){const acc={};DATA.courses.forEach(course=>{Object.entries(course.qe?.[k]||{}).forEach(([v,n])=>{if(['1','2','3','4','5','6'].includes(v))acc[v]=(acc[v]||0)+n})});return meanFromEntries(Object.entries(acc))}const nationalByKey={};axisDefs.forEach(a=>a.keys.forEach(k=>nationalByKey[k]=nationalStatsFor(k)));const axisStats=axisDefs.map(a=>{const vals=a.keys.map(k=>statsFor(k)?.media).filter(v=>v!=null),natVals=a.keys.map(k=>nationalByKey[k]?.media).filter(v=>v!=null);return{...a,med:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null,national:natVals.length?natVals.reduce((s,v)=>s+v,0)/natVals.length:null,min:vals.length?Math.min(...vals):null,max:vals.length?Math.max(...vals):null,count:vals.length,nationalCount:natVals.length}}).filter(a=>a.count);let out='';if(axisStats.length){out+='<div class="qe-axis-summary"><table class="qe-axis-table"><thead><tr><th>Área</th><th>Curso</th><th>Nacional</th><th>Menor</th><th>Maior</th></tr></thead><tbody>'+axisStats.map(a=>'<tr><td><div class="qe-axis-name">'+esc(a.name)+'</div><span class="qe-axis-count">'+a.count+' questões</span></td><td class="qe-axis-num">'+fmt(a.med,1)+'</td><td class="qe-axis-num qe-national-num">'+(a.national==null?'-':fmt(a.national,1))+'</td><td class="qe-axis-num">'+fmt(a.min,1)+'</td><td class="qe-axis-num">'+fmt(a.max,1)+'</td></tr>').join('')+'</tbody></table><div class="qe-axis-bars">'+axisStats.map(a=>'<div class="qe-axis-bar-row qe-axis-compare-row"><b>'+esc(a.name)+'<br><span style="co function nationalProficientPositionChart(c){
  const coursePct = x => {
    const direct = Number(x.acimaPadraoPct);

    if (Number.isFinite(direct)) {
      return direct <= 1 ? direct * 100 : direct;
    }

    const q = Number(x.acimaPadraoQtd);
    const total = Number(x.participantes || x.presentesValidos);

    if (Number.isFinite(q) && Number.isFinite(total) && total > 0) {
      return q / total * 100;
    }

    const vals = Array.isArray(x.alunos)
      ? x.alunos.map(a => Number(a.nota)).filter(Number.isFinite)
      : [];

    return vals.length
      ? vals.filter(v => v >= 60).length / vals.length * 100
      : NaN;
  };

  const rows = DATA.courses
    .map(x => ({
      pct: coursePct(x),
      sigla: x.sigla || '',
      ies: x.ies || ''
    }))
    .filter(x => Number.isFinite(x.pct));

  const course = coursePct(c);

  if (!rows.length || !Number.isFinite(course)) return '';

  const values = rows.map(x => x.pct).sort((a, b) => a - b);
  const n = values.length;

  const mean = values.reduce((a, b) => a + b, 0) / n;
  const min = values[0];
  const max = values[values.length - 1];

  const bins = [];

  for (let a = 0; a < 100; a += 10) {
    bins.push({
      from: a,
      to: a + 10,
      label: `${a}-${a + 10}%`,
      count: 0
    });
  }

  values.forEach(v => {
    const b = bins.find((b, i) =>
      v >= b.from && (v < b.to || (i === bins.length - 1 && v <= b.to))
    );

    if (b) b.count++;
  });

  const maxPct = Math.max(...bins.map(b => b.count / n * 100), 1);

  const W = 720;
  const H = 272;
  const L = 58;
  const R = 28;
  const T = 30;
  const B = 62;

  const plotW = W - L - R;
  const plotH = H - T - B;

  const start = 0;
  const stop = 100;
  const span = 100;

  const x = v =>
    L + ((Math.max(start, Math.min(stop, v)) - start) / span) * plotW;

  const y = p =>
    T + plotH - (p / maxPct) * plotH;

  const grid = [0, .25, .5, .75, 1].map(t => {
    const gy = T + plotH - plotH * t;
    const val = maxPct * t;

    return `
      <line 
        x1="${L}" 
        y1="${gy.toFixed(1)}" 
        x2="${W - R}" 
        y2="${gy.toFixed(1)}" 
        stroke="#d9e5f3" 
        stroke-dasharray="5 5"
      />
      <text 
        x="${L - 12}" 
        y="${(gy + 4).toFixed(1)}" 
        text-anchor="end" 
        class="np-axis-label"
      >
        ${fmt(val, 0)}
      </text>
    `;
  }).join('');

  const bw = Math.max(18, (plotW / bins.length) * .68);

  const bars = bins.map(b => {
    const bp = b.count / n * 100;
    const h = Math.max(2, T + plotH - y(bp));
    const bx = x((b.from + b.to) / 2) - bw / 2;

    return `
      <rect 
        x="${bx.toFixed(1)}" 
        y="${(T + plotH - h).toFixed(1)}" 
        width="${bw.toFixed(1)}" 
        height="${h.toFixed(1)}" 
        rx="4" 
        fill="#ff981f" 
        opacity=".88"
      />
      <text 
        x="${(bx + bw / 2).toFixed(1)}" 
        y="${(T + plotH + 22).toFixed(1)}" 
        text-anchor="middle" 
        class="np-axis-label"
      >
        ${b.label}
      </text>
    `;
  }).join('');

  const cx = x(course);
  const mx = x(mean);

  /*
    Ajuste importante:
    - cx é a posição real do curso selecionado.
    - mx é a posição real da média nacional.
    - Os rótulos ficam centralizados sobre suas próprias linhas.
    - Quando estão próximos, muda apenas a altura do texto, não a posição horizontal.
  */

  const courseLabelX = Math.max(L + 42, Math.min(W - R - 42, cx));
  const meanLabelX = Math.max(L + 42, Math.min(W - R - 42, mx));

  const labelsClose = Math.abs(cx - mx) < 82;

  const meanLabelY = labelsClose ? T - 17 : T - 9;
  const courseLabelY = labelsClose ? T - 4 : T - 9;

  const courseLine = `
    <line 
      x1="${cx.toFixed(1)}" 
      y1="${T - 2}" 
      x2="${cx.toFixed(1)}" 
      y2="${(T + plotH).toFixed(1)}" 
      stroke="#ef4444" 
      stroke-width="2.2" 
      stroke-dasharray="6 5"
    />
    <text 
      x="${courseLabelX.toFixed(1)}" 
      y="${courseLabelY.toFixed(1)}" 
      text-anchor="middle" 
      class="np-course-label"
    >
      ${esc(c.sigla || c.ies || 'Seu curso')}: ${fmt(course, 1)}%
    </text>
  `;

  const meanLine = `
    <line 
      x1="${mx.toFixed(1)}" 
      y1="${T - 2}" 
      x2="${mx.toFixed(1)}" 
      y2="${(T + plotH).toFixed(1)}" 
      stroke="#3b82f6" 
      stroke-width="2" 
      stroke-dasharray="4 4"
    />
    <text 
      x="${meanLabelX.toFixed(1)}" 
      y="${meanLabelY.toFixed(1)}" 
      text-anchor="middle" 
      class="np-mean-label"
    >
      Nacional: ${fmt(mean, 1)}%
    </text>
  `;

  return `
    <div class="card national-position-card national-proficient-card">
      <h3>Posição Nacional - Proficientes</h3>

      <p class="muted">
  Distribuição dos cursos pelo percentual de alunos com desempenho igual ou superior a 60, corte de proficiência definido pelo MEC, com destaque para o curso selecionado.
</p>

      <svg 
        class="national-svg" 
        viewBox="0 0 ${W} ${H}" 
        role="img" 
        aria-label="Distribuição nacional do percentual de alunos proficientes"
      >
        <text 
          x="${L}" 
          y="${H - 18}" 
          class="np-axis-title"
        >
          % Proficientes do Curso
        </text>

        <text 
          x="18" 
          y="${T + plotH / 2}" 
          transform="rotate(-90 18 ${T + plotH / 2})" 
          text-anchor="middle" 
          class="np-axis-title"
        >
          % Cursos
        </text>

        ${grid}

        <line 
          x1="${L}" 
          y1="${T + plotH}" 
          x2="${W - R}" 
          y2="${T + plotH}" 
          stroke="#0f2b4c" 
          stroke-width="2"
        />

        ${bars}
        ${meanLine}
        ${courseLine}
      </svg>

      <div class="national-legend">
        <span>
          <i style="background:#ff981f"></i>
          Distribuição
        </span>

        <span>
          <i class="course"></i>
          Seu curso (${fmt(course, 1)}%)
        </span>

        <span>
          <i class="mean"></i>
          Média nacional
        </span>
      </div>

      <div class="national-summary">
        ${nf.format(n)} cursos · Média: ${fmt(mean, 1)}% · Menor: ${fmt(min, 1)}% · Maior: ${fmt(max, 1)}%
      </div>
    </div>
  `;
}

function macroRadarAnalysis(c){
 const d=ITEM_ANALYSIS.courses[String(c.coCurso)];
 const rows=[...((d&&d.macrodominios)||[])].filter(x=>x&&Number.isFinite(Number(x.taxa))&&x.macrodominio);
 if(rows.length<3)return'';
 rows.sort((a,b)=>(Number(b.taxa)-Number(a.taxa))||String(a.macrodominio).localeCompare(String(b.macrodominio),'pt-BR'));
 const cx=220,cy=192,r=108,n=rows.length,levels=[.2,.4,.6,.8,1];
 const point=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/n;return {x:cx+Math.cos(ang)*r*v,y:cy+Math.sin(ang)*r*v,ang};};
 const pct=x=>fmt((Number(x)||0)*100,1)+'%';
 const shortName=t=>String(t||'').replace('Registro, documentação e notificação','Registro, documentação e notificação').replace('Conduta terapêutica, cuidado longitudinal e procedimentos','Conduta terapêutica e cuidado longitudinal').replace('Saúde coletiva, APS, vigilância e redes de atenção','Saúde coletiva, APS e vigilância').replace('Exames, propedêutica e uso racional de recursos','Exames, propedêutica e recursos');
 const wrap=(txt,max=20)=>{const words=shortName(txt).split(/\s+/);const out=[];let line='';words.forEach(w=>{const next=(line+' '+w).trim();if(next.length>max&&line){out.push(line);line=w}else line=next});if(line)out.push(line);return out.slice(0,3);};
 const grid=levels.map(l=>`<polygon class="radar-grid-poly" points="${rows.map((_,i)=>{const p=point(i,l);return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ')}"></polygon>`).join('');
 const axes=rows.map((_,i)=>{const p=point(i,1);return`<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`}).join('');
 const coursePts=rows.map((x,i)=>{const p=point(i,Math.max(0,Math.min(1,Number(x.taxa)||0)));return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');
 const nationalPts=rows.map((x,i)=>{const p=point(i,Math.max(0,Math.min(1,Number(x.nacional)||0)));return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');
 const dots=rows.map((x,i)=>{const p=point(i,Math.max(0,Math.min(1,Number(x.taxa)||0)));return`<circle class="radar-course-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5"/>`}).join('');
 const nationalDots=rows.map((x,i)=>{const p=point(i,Math.max(0,Math.min(1,Number(x.nacional)||0)));return`<circle class="radar-national-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"/>`}).join('');
 const labels=rows.map((x,i)=>{const p=point(i,1.48),lines=wrap(x.macrodominio,16);let anchor='middle';let lx=p.x;if(Math.cos(p.ang)>.35){anchor='start';lx=Math.min(p.x,330)}if(Math.cos(p.ang)<-.35){anchor='end';lx=Math.max(p.x,110)}const ly=Math.max(34,Math.min(354,p.y));const dy=lines.length>2?-12:-7;return`<text class="radar-label" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${lines.map((l,j)=>`<tspan x="${lx.toFixed(1)}" dy="${j?11:dy}">${esc(l)}</tspan>`).join('')}<tspan class="radar-label-pct" x="${lx.toFixed(1)}" dy="13">${pct(x.taxa)}</tspan><tspan class="radar-label-pct-national" x="${lx.toFixed(1)}" dy="12">${pct(x.nacional)}</tspan></text>`}).join('');
 const levelLabels=levels.map(l=>`<text class="radar-level" x="${cx+7}" y="${(cy-r*l+4).toFixed(1)}">${Math.round(l*100)}%</text>`).join('');
 const rank=rows.map((x,i)=>`<div class="macro-radar-rank-item"><span class="macro-radar-pos">${i+1}</span><span class="macro-radar-rank-name">${esc(x.macrodominio)}</span><strong class="macro-radar-rank-value">${pct(x.taxa)}</strong></div>`).join('');
 return `<section class="macro-radar-card"><div class="macro-radar-head"><div class="macro-radar-icon">◇</div><div><h2 class="macro-radar-title">Mapa de Radar dos Macrodomínios Didáticos</h2><p class="macro-radar-sub">Visualização do desempenho do curso por grandes áreas pedagógicas da formação médica.</p></div></div><div class="macro-radar-grid"><div class="macro-radar-plot"><svg class="macro-radar-svg" viewBox="0 0 440 390" role="img" aria-label="Radar dos macrodomínios didáticos"><g>${grid}${axes}${levelLabels}<polygon class="radar-national-area" points="${nationalPts}"></polygon><polygon class="radar-course-area" points="${coursePts}"></polygon>${nationalDots}${dots}${labels}</g></svg></div><aside class="macro-radar-ranking"><div class="macro-radar-ranking-title"><span class="macro-radar-trophy">★</span><div><strong>Desempenho do Curso</strong><span>Macrodomínios ordenados do maior para o menor</span></div></div><div class="macro-radar-rank-list">${rank}</div></aside></div><div class="macro-radar-legend"><span><i class="course"></i>Curso</span><span><i class="national"></i>Nacional</span></div><div class="macro-radar-note"><strong>Leitura:</strong> a linha laranja mostra o desempenho do curso; a linha roxa mostra a referência nacional em cada macrodomínio didático.</div></section>`;
}
function groupedReferenceAnalysis(c,key,nameField,title,subtitle,countLabel){const d=ITEM_ANALYSIS.courses[String(c.coCurso)];const rows=[...((d&&d[key])||[])].sort((a,b)=>(b.taxa??-1)-(a.taxa??-1)||String(a[nameField]||'').localeCompare(String(b[nameField]||''),'pt-BR'));if(!rows.length)return'';const cards=rows.map(x=>{const taxa=x.taxa==null?null:Number(x.taxa),nac=x.nacional==null?null:Number(x.nacional),ref=x.conceitoRef==null?null:Number(x.conceitoRef);const refHtml=ref==null?'':`<div class="rate-pill concept"><span>${esc(x.conceitoLabel||'ENAMED')}</span><b>${fmt(ref*100,1)}%</b></div>`;return `<div class="competence-item"><div class="competence-name"><strong>${esc(x[nameField]||'Sem classificação informada')}</strong><small>${nf.format(x.questoes||0)} questão(ões)</small></div><div class="competence-rates"><div class="rate-pill course"><span>Curso</span><b>${taxa==null?'-':fmt(taxa*100,1)+'%'}</b></div><div class="rate-pill national"><span>Nacional</span><b>${nac==null?'-':fmt(nac*100,1)+'%'}</b></div>${refHtml}</div></div>`}).join('');const note=key==='macrodominios'?`<div class="competence-note macro-note"><b>Leitura pedagógica:</b> Para tornar a análise mais pedagógica, as competências oficiais do ENAMED foram organizadas em macrodomínios didáticos. Esse agrupamento permite identificar, de forma mais clara, em quais grandes áreas da formação médica o curso apresenta maior desempenho ou maior necessidade de intervenção. Cada macrodomínio reúne questões associadas a competências próximas, considerando o foco principal exigido para a resolução de cada item.</div>`:key==='focosPedagogicos'?`<div class="competence-note focus-note"><b>Leitura pedagógica:</b> Nesta análise, cada questão foi classificada de acordo com o foco pedagógico predominante, ou seja, o principal conhecimento, habilidade ou decisão exigida para sua resolução. Esse detalhamento pedagógico traduz as competências em áreas mais específicas, permitindo uma leitura mais objetiva das dimensões em que o curso se destaca e daquelas que demandam maior atenção formativa. Os resultados comparam a média do curso com a média nacional e com a referência da faixa ENAMED correspondente.</div>`:'';return `<section class="competence-analysis-card synthesis-card ${key==='macrodominios'?'macro-orange':''}"><div class="competence-head"><div class="competence-title"><div class="competence-icon">◇</div><div><h3>${esc(title)}</h3><p>${esc(subtitle)}</p></div></div><div class="item-pill">${nf.format(rows.length)} ${esc(countLabel)}</div></div><div class="competence-grid">${cards}</div>${note}</section>`}
function macroDomainAnalysis(c){return groupedReferenceAnalysis(c,'macrodominios','macrodominio','Macrodomínios Didáticos','Síntese do desempenho do curso por grandes áreas pedagógicas da formação médica.','macrodomínio(s)')}

function itemAnalysis(c){const d=ITEM_ANALYSIS.courses[String(c.coCurso)];if(!d)return'';const levels=ITEM_ANALYSIS.levels||[];const qs=[...((d.questoes)||[])].sort((a,b)=>Number(a.q)-Number(b.q));const lvlHtml=levels.map(l=>`<div class="level-chip ${itemLevelClass(l)}"><b>${nf.format((d.niveis||{})[l]||0)}</b><span>${esc(l)}</span></div>`).join('');const qHtml=qs.map(q=>{const taxa=Number(q.taxa||0),nac=Number(q.nacional||0),ref=q.conceitoRef==null?null:Number(q.conceitoRef||0);const refHtml=ref==null?'':`<div class="rate-pill concept"><span>${esc(q.conceitoLabel||'ENAMED')}</span><b>${fmt(ref*100,1)}%</b></div>`;return `<div class="catalog-item"><div class="catalog-num">${q.q}</div><div class="catalog-content"><strong>${esc(q.conteudo)}</strong><div class="catalog-meta"><span class="level-badge ${itemLevelClass(q.nivel)}">${esc(q.nivel)}</span></div><div class="catalog-rates"><div class="rate-pill course"><span>Curso</span><b>${fmt(taxa*100,1)}%</b></div><div class="rate-pill national"><span>Nacional</span><b>${fmt(nac*100,1)}%</b></div>${refHtml}</div></div></div>`}).join('');return `<section class="item-analysis-card"><div class="item-analysis-head"><div class="item-analysis-title"><div class="item-analysis-icon">✓</div><div><h3>Questões, Conteúdos e Dificuldade</h3><p>Lista completa das questões válidas, usando o número do Caderno 1 como referência. A classificação segue o índice de facilidade MEC/INEP.</p></div></div><div class="item-pill">${nf.format(d.participantes||0)} participante(s)</div></div><div class="catalog-summary">${lvlHtml}</div><div class="question-catalog">${qHtml}</div><div class="item-note"><b>Regra MEC/INEP:</b> índice de facilidade ≥ 0,86: muito fácil; 0,61 a 0,85: fácil; 0,41 a 0,60: médio; 0,16 a 0,40: difícil; ≤ 0,15: muito difícil. Questões anuladas não entram no cálculo.</div></section>`}
